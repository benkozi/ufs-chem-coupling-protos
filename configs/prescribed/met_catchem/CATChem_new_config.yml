# CATChem science configuration of the met_catchem prototype: sea salt only, no external emissions, aqmio
# diagnostics on. From extern/CATChem/tests/CATChem_nuopc_lifecycle_config.yml with the prototype's clock, levels
# and output. The species file is the submodule's, by a path relative to this file (the cap resolves relative
# paths against the config's directory); no emission_filename, since the cap loads a named file and fails on a
# missing one. The clock here is informational: the cap runs on the driver's clock, and the level count is
# overridden by the host's rank-4 tracer field. CATChem_new_config_nodiag.yml is this file with the diagnostics
# off, for the file-free debug variant (grid_source: analytic).
simulation:
  name: met_catchem
  start_date: 20210322 0600
  end_date: 20210323 0600
  species_filename: ../../../extern/CATChem/tests/Configs/Default/CATChem_species.yml
  verbose:
    activate: false
grid:
  number_of_levels: 127
timesteps:
  transport_timestep_in_s: 720
  chemistry_timestep_in_s: 720
diagnostics:
  output:
    enabled: true
    # relative to the run working directory (build/protos/met_catchem/run_<res>_np<N>/, git-ignored)
    directory: catchem_diag
    prefix: catchem
    frequency: 3600
    format: netcdf
    diag_list:
      - seas1
      - seas2
      - seas3
      - seas4
      - seas5
  collection:
    enabled: false
run_phases:
  proto:
    description: Sea salt from the analytic meteorology; the only process without file inputs.
    processes:
      - seasalt
processes:
  seasalt:
    activate: true
    diagnostics: false
    scheme: geos12
  # The Fortran reader defaults this to true when absent: it must be written explicitly.
  extemis:
    activate: false
