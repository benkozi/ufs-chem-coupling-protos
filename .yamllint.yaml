# Kept coherent with [tool.yamlfix] in pyproject.toml (no document start).
# design/ holds records; extern/ holds the submodules; build/ and .venv/ are generated; configs/wm/ holds
# generated configuration sets kept byte for byte as the generator writes them.
extends: default
ignore: |
  design/
  configs/wm/
  extern/
  build/
  .venv/
rules:
  document-start: disable
  line-length:
    max: 120
  # Workflow files key on `on:`, which yamlfix normalizes to the bare form; check truthy values, not keys.
  truthy:
    check-keys: false
