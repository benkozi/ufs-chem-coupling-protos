            sigma_deg: 15.0
            amplitude: 2.5e-09
          - lon: 135.0
            lat: -20.0
            sigma_deg: 18.0
            amplitude: 3.0e-09
        diurnal:
          relative_amplitude: 0.8
          peak_local_hour: 15.0
        seasonal:
