# Default parameter set of the mock data step: the manifest minus generator, resolution and fix files.
# Parsed by tools.manifest.ManifestDefaults; paths are relative to --out. Edit here, not in Python.
# Keep CATChem's `NO` quoted: an unquoted NO is boolean false in YAML 1.1.
earth_radius_m: 6371000.0
clock:
  start: '2021-03-22T06:00:00Z'
  duration_hours: 24
  step_seconds: 720
  n_levels: 127
grids:
  inventory:
    dlon: 1.0
    dlat: 1.0
    lon_first: -179.5
    lat_first: -89.5
    nlon: 360
    nlat: 180
  gmi:
    dlon: 2.5
    dlat: 2.0
    lon_first: -178.75
    lat_first: -89.0
    nlon: 144
    nlat: 90
land_mask:
  grid: inventory
  file: inventories/landmask.nc
  threshold: 0.5
  continents:
    - lon: 40.0
      lat: 25.0
      semi_axis_lon: 70.0
      semi_axis_lat: 40.0
      rotation_deg: 10.0
      exponent: 4.0
    - lon: -80.0
      lat: 5.0
      semi_axis_lon: 30.0
      semi_axis_lat: 60.0
      rotation_deg: -20.0
      exponent: 4.0
    - lon: 135.0
      lat: -25.0
      semi_axis_lon: 18.0
      semi_axis_lat: 12.0
      rotation_deg: 0.0
      exponent: 4.0
categories:
  anthro:
    file: inventories/anthro.nc
    cadence: hourly
    regrid_method: conserve
    cece_mapalgo: consd
    grid: inventory
    is_3d: false
    level_order: bottom_up
    masked_by: land
    variables:
      'NO':
        units: kg m-2 s-1
        long_name: Nitrogen oxide emission flux
        background: 0.0
        sources:
          - lon: 15.0
            lat: 48.0
            sigma_deg: 12.0
            amplitude: 2.0e-10
          - lon: -80.0
            lat: 40.0
            sigma_deg: 15.0
            amplitude: 2.5e-10
          - lon: 115.0
            lat: 32.0
            sigma_deg: 18.0
            amplitude: 3.0e-10
        diurnal:
          relative_amplitude: 0.5
          peak_local_hour: 14.0
        seasonal:
        vertical:
      SO2:
        units: kg m-2 s-1
        long_name: Sulfur dioxide emission flux
        background: 0.0
        sources:
          - lon: 15.0
            lat: 48.0
            sigma_deg: 12.0
            amplitude: 1.5e-10
          - lon: -80.0
            lat: 40.0
            sigma_deg: 15.0
            amplitude: 1.875e-10
          - lon: 115.0
            lat: 32.0
            sigma_deg: 18.0
            amplitude: 2.25e-10
        diurnal:
          relative_amplitude: 0.5
          peak_local_hour: 14.0
        seasonal:
        vertical:
      POC:
