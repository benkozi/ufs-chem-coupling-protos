  gmi:
    file: inventories/gmi.nc
    cadence: monthly
    regrid_method: bilinear
    cece_mapalgo: bilinear
    grid: gmi
    is_3d: true
    level_order: bottom_up
    masked_by: none
    variables:
      oh:
        units: cm-3
        long_name: Hydroxyl radical number concentration
        background: 500000.0
        sources:
          - lon: 0.0
            lat: 0.0
            sigma_deg: 30.0
            amplitude: 2000000.0
        diurnal:
        seasonal:
          relative_amplitude: 0.3
          peak_month: 7
        vertical:
          scale_height_levels: 25.0
      h2o2:
        units: mol mol-1
        long_name: Hydrogen peroxide volume mixing ratio
