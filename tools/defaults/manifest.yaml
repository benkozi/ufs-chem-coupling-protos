            sigma_deg: 12.0
            amplitude: 1.0e-11
          - lon: -80.0
            lat: 40.0
            sigma_deg: 15.0
            amplitude: 1.25e-11
          - lon: 115.0
            lat: 32.0
            sigma_deg: 18.0
            amplitude: 1.5e-11
        diurnal:
          relative_amplitude: 0.5
          peak_local_hour: 14.0
        seasonal:
        vertical:
  fire:
    file: inventories/fire.nc
    cadence: hourly
    regrid_method: conserve
    cece_mapalgo: consd
    grid: inventory
    is_3d: false
    level_order: bottom_up
    masked_by: land
    variables:
      'NO':
        units: kg m-2 s-1
        long_name: Fire nitrogen oxide emission flux
        background: 0.0
