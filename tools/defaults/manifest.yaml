            amplitude: 1.5e-10
        diurnal:
          relative_amplitude: 0.8
          peak_local_hour: 15.0
        seasonal:
        vertical:
      SO2:
        units: kg m-2 s-1
        long_name: Fire sulfur dioxide emission flux
        background: 0.0
        sources:
          - lon: 25.0
            lat: -5.0
            sigma_deg: 12.0
            amplitude: 3.0e-11
          - lon: -60.0
            lat: -10.0
            sigma_deg: 15.0
            amplitude: 3.75e-11
          - lon: 135.0
            lat: -20.0
