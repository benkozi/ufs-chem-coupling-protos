          - lon: -80.0
            lat: 40.0
            sigma_deg: 15.0
            amplitude: 5.0e-11
          - lon: 115.0
            lat: 32.0
            sigma_deg: 18.0
            amplitude: 6.0e-11
        diurnal:
          relative_amplitude: 0.5
          peak_local_hour: 14.0
        seasonal:
        vertical:
      TERP:
