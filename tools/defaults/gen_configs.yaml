# Parameter set of the config generator (tools/gen_configs.py): everything the emitted files need that the
# manifest does not carry. Parsed by tools.gen_defaults.GenDefaults. Edit here, not in Python.
# The emission map follows CATChem's own NUOPC test map (tests/CATChem_emission.yml: NO feeds no3, the
# Default mechanism has no NO species) and the AQM map for the dust and fengsha MET_* targets; fire CO and
# FRP are not applied (no CO species; plume rise stays off). Keep 'NO' quoted (YAML 1.1 reads NO as false).
prototype: cece_met_catchem
# NUOPC's generic Verbosity: `high` dumps every import on entry and exit of every Run (56 MB per PET log for
# the 24 h C48 run, task 6); the components' own log lines do not depend on it.
verbosity: low
processes:
  - seasalt
seasalt_scheme: geos12
# CATChem's NetCDF diagnostics (aqmio) stay off in the generated run: their output fills the disk of the
# 24 h run (task 6); CECE's output and diagnostics are off too (cece_yaml.py). Switch on for a by-hand run.
diagnostics:
  enabled: false
  directory: catchem_diag
  prefix: catchem
  frequency: 3600
  format: netcdf
  diag_list:
    - seas1
    - seas2
    - seas3
    - seas4
    - seas5
run_sequence:
  - CECE
  - CECE -> MET
  - MET
  - CECE -> CATCHEM
  - MET -> CATCHEM
  - CATCHEM
  - CATCHEM -> MET
# MET also consumes these CECE exports (met_hosted_imports::) and writes their per-level totals to
# met_import_totals.yaml; the conservation check compares level 1 with the inventory totals (task 6).
hosted_imports:
  - category: anthro
    variable: SO2
# Manifest (CF) units -> CATChem's spelling in the emission map, as CATChem's own AQM map writes them:
# catchem_emis_apply converts kg/m2/s, mol/mol, molec/cm3 and nmol/l and applies any other string as zero,
# with a warning per cell (task 6). The MET_* inputs (dust, fengsha) are not converted.
catchem_units:
  kg m-2 s-1: kg/m2/s
  mol mol-1: mol/mol
  cm-3: molec/cm3
  nmol L-1: nmol/l
  '1': '1'
  m s-1: m/s
  MW: MW
# CECE's AMIO staging pools (cece.yaml driver.amio_*): CECE's defaults, 8 buffers of at least 32 MiB per data
# file and prefetch 2, fill about 2.1 GB per PET at C48 in the first minute; these sizes measured 0.87 GB at
# no time cost (performance task, 2026-10-28). A record larger than the capacity still gets its own buffer.
cece_amio:
  worker_threads: 1
  staging_buffer_count: 2
  staging_buffer_capacity_bytes: 4194304
  prefetch_depth: 1
categories:
  anthro:
    apply_method: add
    vertical_dist: none
    variables:
      'NO':
        long_name: Nitrogen Oxide
        scale:
          - 1.0
        map:
          - no3
      SO2:
        long_name: Sulfur Dioxide
        scale:
          - 1.0
        map:
          - so2
      POC:
        long_name: Primary Organic Carbon
        scale:
          - 0.9
          - 0.9
        map:
          - oc1
          - oc2
      TERP:
        long_name: Terpenes
        scale:
          - 0.09
        map:
          - oc2
      ISOP:
        long_name: Isoprene
        scale:
          - 0.054
        map:
          - oc2
      PEC:
        long_name: Primary Elemental Carbon
        scale:
          - 0.8
          - 0.2
        map:
          - bc1
          - bc2
      PSO4:
        long_name: Primary Sulfate
        scale:
          - 1.0
        map:
          - so4
  fire:
    apply_method: add
    vertical_dist: Ppbl
    variables:
      'NO':
        long_name: Fire Nitrogen Oxide
        scale:
          - 1.0
        map:
          - no3
      SO2:
        long_name: Fire Sulfur Dioxide
        scale:
          - 1.0
        map:
          - so2
      CO:
        long_name: Fire Carbon Monoxide
        scale: []
        map: []
      FRP:
        long_name: Fire Radiative Power
        scale: []
        map: []
  gmi:
    apply_method: replace
    vertical_dist: none
    variables:
      oh:
        long_name: Hydroxyl Radical
        scale:
          - 1.0
        map:
          - oh
      h2o2:
        long_name: Hydrogen Peroxide
        scale:
          - 1.0
        map:
          - h2o2
      no3:
        long_name: Nitrate Radical
        scale:
          - 1.0
        map:
          - no3
  dms:
    apply_method: replace
    vertical_dist: none
    variables:
      dms:
        long_name: Dimethyl Sulfide
        scale:
          - 1.0
        map:
          - dms_in
  dust:
    apply_method: replace
    vertical_dist: none
    variables:
      clayfrac:
        long_name: Clay Fraction
        scale:
          - 1.0
        map:
          - MET_CLAYFRAC
      sandfrac:
        long_name: Sand Fraction
        scale:
          - 1.0
        map:
          - MET_SANDFRAC
      sep:
        long_name: Sediment Supply Map
        scale:
          - 1.0
        map:
          - MET_SSM
      uthres:
        long_name: Friction Velocity Threshold
        scale:
          - 1.0
        map:
          - MET_USTAR_THRESHOLD
  fengsha:
    apply_method: replace
    vertical_dist: none
    variables:
      albedo_drag:
        long_name: Drag Partition
        scale:
          - 1.0
        map:
          - MET_RDRAG
